<div class="w-full max-w-md md:max-w-2xl lg:max-w-3xl overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/90 shadow-2xl backdrop-blur-sm">
    <div class="border-b border-slate-800 bg-slate-900 px-6 py-4 text-center sm:px-8">
        <h1 class="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">
            Task<span class="text-indigo-500">Manager</span>
        </h1>
        <p class="text-xs text-slate-400 sm:text-xs">Plataforma de gestión de tareas empresariales</p>
    </div>
    <div class="relative grid grid-cols-1 md:grid-cols-2 md:min-h-[379px]">
        <div class="flex flex-col justify-between p-6 sm:p-8 transition-all duration-500 ease-in-out"
            [class.md:flex]="true"
            [class.bg-slate-900/50]="isRegister()"
            [class.md:col-2]="isRegister()">
            <div>
                <div class="mb-6"> 
                    <h2 class="text-xl font-bold text-white">{{ dataFormHeader().formTitle }}</h2>
                    <p class="text-xs text-slate-400">{{ dataFormHeader().formMessage }}</p>
                </div>
                @if (!isRegister()) {
                    <app-login />
                } @else {
                    <app-register (toggleAuth)="toggleAuth()" />
                }
                <app-mobile-toggle [isRegister]="isRegister()" (toggleAuth)="toggleAuth()" />
            </div>
        </div>
        <app-desktop-toggle [isRegister]="isRegister()" (toggleAuth)="toggleAuth()"/>
    </div>
</div>
