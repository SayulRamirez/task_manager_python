<div class="flex min-h-screen w-full items-center justify-center bg-slate-950 p-4 sm:p-6 lg:p-8">
    <div
        class="w-full max-w-5xl overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/90 shadow-2xl backdrop-blur-sm">
        <div class="border-b border-slate-800 bg-slate-900 px-6 py-4 text-center sm:px-8">
            <h1 class="text-2xl font-extrabold tracking-tight text-white sm:text-3xl">
                Task<span class="text-indigo-500">Manager</span>
            </h1>
            <p class="text-xs text-slate-400 sm:text-sm">Plataforma de gestión de tareas empresariales</p>
        </div>

        <div class="relative grid grid-cols-1 md:grid-cols-2">
            <app-form-content [isRegister]="isRegister" formTitle="Iniciar Sesión" formMessage="Ingresa tu usuario y contraseña para acceder.">
                <form action="/enviar-datos" method="post" class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="login-username"
                            class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                            Usuario
                        </label>
                        <input type="text" id="login-username" name="username" placeholder="ej. jperez" required
                            class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                    </div>
    
                    <!-- Password -->
                    <div>
                        <label for="login-password"
                            class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                            Contraseña
                        </label>
                        <input type="password" id="login-password" name="password" required placeholder="••••••••"
                            class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                    </div>
    
                    <div class="pt-2">
                        <button type="submit"
                            class="w-full rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-md transition duration-200 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 active:scale-[0.98]">
                            Ingresar al sistema
                        </button>
                    </div>
                </form>
                <app-mobile-toggle message="¿No tienes una cuenta aún?" titleButton="Regístrate aquí" [isRegister]="false" (toggleAuth)="toggleAuth()" />
            </app-form-content>

            <app-form-content [isRegister]="!isRegister" formTitle="Registro de Usuario" formMessage="Crea tu cuenta personal para asignación de tareas.">
                <form action="/enviar-datos" method="post" class="space-y-4">
                    <!-- Nombre(s) y Apellido Paterno -->
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div>
                            <label for="firstName"
                                class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                                Nombre(s)
                            </label>
                            <input type="text" id="firstName" name="firstName" placeholder="Juan" required
                                class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                        </div>
    
                        <div>
                            <label for="lastName"
                                class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                                Apellido Paterno
                            </label>
                            <input type="text" id="lastName" name="lastName" placeholder="Pérez" required
                                class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                        </div>
                    </div>
    
                    <!-- Apellido Materno y Teléfono -->
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <div>
                            <label for="maternalSurname"
                                class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                                Apellido Materno
                            </label>
                            <input type="text" id="maternalSurname" name="maternalSurname" placeholder="Gómez"
                                class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                        </div>
    
                        <div>
                            <label for="phoneNumber"
                                class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                                Teléfono
                            </label>
                            <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="5512345678" required
                                class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                        </div>
                    </div>
    
                    <!-- Subsección: Credenciales -->
                    <div class="mt-4 rounded-xl border border-slate-800 bg-slate-950/60 p-3.5">
                        <span class="mb-3 block text-xs font-semibold text-indigo-400">
                            Credenciales de acceso
                        </span>
    
                        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                            <div>
                                <label for="reg-username"
                                    class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                                    Usuario
                                </label>
                                <input type="text" id="reg-username" name="username" placeholder="jperez" required
                                    class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3 py-1.5 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                            </div>
    
                            <div>
                                <label for="reg-password"
                                    class="mb-1.5 block text-xs font-medium uppercase tracking-wider text-slate-300">
                                    Contraseña
                                </label>
                                <input type="password" id="reg-password" name="password" placeholder="••••••••"
                                    required
                                    class="w-full rounded-lg border border-slate-700 bg-slate-800/80 px-3 py-1.5 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition duration-200 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
                            </div>
                        </div>
                    </div>
    
                    <div class="pt-2">
                        <button type="submit"
                            class="w-full rounded-lg border border-indigo-500/30 bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white shadow-md transition duration-200 hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 active:scale-[0.98]">
                            Crear cuenta
                        </button>
                    </div>
                </form>
                <app-mobile-toggle message="¿Ya tienes una cuenta registrada?" titleButton="Inicia sesión aquí" [isRegister]="true" (toggleAuth)="toggleAuth()" />
            </app-form-content>

            <div 
            class="hidden md:flex absolute top-0 right-0 w-1/2 h-full z-10 flex-col justify-center items-center p-8 via-indigo-800 to-slate-900 text-white text-center transition-all duration-700 ease-in-out border-l border-indigo-500/20 shadow-2xl"
            [class.bg-gradient-to-br]="!isRegister" 
            [class.from-indigo-600]="!isRegister"
            [class.bg-gradient-to-bl]="isRegister" 
            [class.from-indigo-700]="isRegister"
            [class.-translate-x-full]="isRegister">

            @if (!isRegister) {
                <app-desktop-toggle 
                question="¿Primera vez por aquí?"
                description="Regístrate para colaborar con tu equipo y dar seguimiento a tus proyectos asignados."
                titleButton="Crear una cuenta"
                (toggleAuth)="toggleAuth()" />
            } @else {
                <app-desktop-toggle 
                question="¿Ya eres parte del equipo?"
                description="Inicia sesión para revisar tus tareas pendientes y actualizar tu avance del día."
                titleButton="Iniciar Sesión"
                (toggleAuth)="toggleAuth()" />
            }

            </div>
        </div>
    </div>
</div>
