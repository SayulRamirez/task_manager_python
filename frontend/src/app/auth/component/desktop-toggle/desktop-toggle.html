<div class="space-y-4 max-w-xs transition-opacity duration-500">
    <h3 class="text-2xl font-bold tracking-tight">{{ contentToggle().title }}</h3>
    <p class="text-xs text-indigo-200 leading-relaxed">{{ contentToggle().description }}</p>
    <button (click)="onToggleAuth()" type="button"
        class="mt-4 rounded-full border border-indigo-300/40 bg-indigo-600/30 px-6 py-2 text-xs font-semibold text-white shadow-lg backdrop-blur-md transition hover:bg-white hover:text-indigo-900 active:scale-95">
        {{ contentToggle().titleButton }}
    </button>
</div>
