<div class="flex flex-col justify-between p-6 sm:p-8 transition-all duration-500 ease-in-out"
    [class.hidden]="isRegister()" [class.md:flex]="true"
    [class.bg-slate-900/50]="isRegister()">
    <div>
        <div class="mb-6">
            <h2 class="text-xl font-bold text-white">{{ formTitle() }}</h2>
            <p class="text-xs text-slate-400">{{ formMessage() }}</p>
        </div>
        <ng-content />
    </div>
</div>
