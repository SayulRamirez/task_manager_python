<form [formGroup]="formLogin" (ngSubmit)="onSubmitLogin()" class="space-y-4">
    <div class="grid grid-cols-1 gap-4 animate-fade-in">
        <app-input label="Usuario" type="text" placeholder="juan@example.com" [control]="$any(username)" />
    </div>
    <div class="grid grid-cols-1 gap-4 animate-fade-in">
        <app-input label="Contraseña" type="password" placeholder="••••••••" [control]="$any(password)" />
    </div>
    <div class="pt-2">
        <button type="submit" [disabled]="isLoading()"
            class="w-full rounded-lg bg-indigo-600 px-5 py-2.5 text-xs font-semibold text-white shadow-md transition duration-200 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 active:scale-[0.98]">
                @if (isLoading()) {
                <span>Procesando...</span>
            } @else {
                <span>Ingresar al sistema</span>
            }
        </button>
    </div>
    @if (message().show) {
        <app-message-response [message]="message()" />
    }
</form>
